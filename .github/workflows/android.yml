name: Android APK and curriculum validation
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify generated learning materials are reproducible
        run: |
          python3 scripts/build_expanded_content.py
          git diff --exit-code -- app/src/main/assets/expanded.js
      - name: Validate bilingual content and stable IDs
        run: python3 scripts/validate_content.py
      - name: Validate 300-day course
        run: node scripts/verify_course.mjs
      - name: Check JavaScript syntax
        run: |
          for file in app/src/main/assets/*.js; do node --check "$file"; done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify Android SDK
        run: |
          test -d "$ANDROID_HOME"
          echo "Android SDK: $ANDROID_HOME"
      - name: Assemble Android Debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Wolfie-English-v0.6.0-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
