name: Offline neural audio and teacher research
on:
  workflow_dispatch:
    inputs:
      run_audio:
        description: Run the Kokoro/eSpeak comparison (costs runner time)
        type: boolean
        required: false
        default: true
      run_legacy_teacher:
        description: Run the older Qwen2.5 0.5B/1.5B screening matrix
        type: boolean
        required: false
        default: false
permissions:
  contents: read
jobs:
  audio:
    if: inputs.run_audio == true
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends espeak espeak-ng ffmpeg
          python -m pip install 'kokoro-onnx==0.6.1' soundfile
          mkdir -p research-models research-evidence/audio
          python -m pip freeze > research-evidence/audio/python-dependencies.txt
      - name: Download and verify official release assets
        run: |
          cd research-models
          curl --fail --location --retry 2 --max-time 240 -o kokoro-v1.0.int8.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.int8.onnx
          curl --fail --location --retry 2 --max-time 240 -o voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin
          echo 'ae315a79b623f244700e4afb9246c46a26066782e049ba174bf3ba433970ee9c  kokoro-v1.0.int8.onnx' | sha256sum -c
          echo 'bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d  voices-v1.0.bin' | sha256sum -c
          sha256sum *.onnx *.bin > ../research-evidence/audio/model-hashes.txt
      - name: Generate matched A2 B1 B2 audio in two accents
        env:
          OMP_NUM_THREADS: '4'
        run: python scripts/research_audio.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Wolfie-neural-audio-comparison-v2
          path: research-evidence/audio/
  teacher:
    if: inputs.run_legacy_teacher == true
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        include:
          - size: '0.5'
            sha: '74a4da8c9fdbcd15bd1f6d01d621410d31c6fc00986f5eb687824e7b93d7a9db'
          - size: '1.5'
            sha: '6a1a2eb6d15622bf3c96857206351ba97e1af16c30d7a74ee38970e434e9407e'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and verify pinned local inference runtime and model
        env:
          SIZE: ${{ matrix.size }}
          MODEL_SHA: ${{ matrix.sha }}
        run: |
          mkdir -p research-models research-evidence/teacher
          cd research-models
          curl --fail --location --retry 2 --max-time 240 -o llama.zip https://github.com/ggml-org/llama.cpp/releases/download/b6500/llama-b6500-bin-ubuntu-x64.zip
          echo '716803084e565fe779bc2d01ea576c418be141f8fabac97509bc6d7c3cd786b2  llama.zip' | sha256sum -c
          unzip -q llama.zip -d runtime
          file="qwen2.5-${SIZE}b-instruct-q4_k_m.gguf"
          curl --fail --location --retry 2 --max-time 360 -o "$file" "https://huggingface.co/Qwen/Qwen2.5-${SIZE}B-Instruct-GGUF/resolve/main/$file"
          echo "$MODEL_SHA  $file" | sha256sum -c
      - name: Run actual independent CPU teacher screening
        env:
          SIZE: ${{ matrix.size }}
        run: |
          server="$(find "$PWD/research-models/runtime" -type f -name llama-server | head -1)"
          test -x "$server"
          export LD_LIBRARY_PATH="$(dirname "$server"):${LD_LIBRARY_PATH:-}"
          python scripts/research_teacher.py --server "$server" --model "research-models/qwen2.5-${SIZE}b-instruct-q4_k_m.gguf" --out research-evidence/teacher
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Wolfie-teacher-Qwen-${{ matrix.size }}B
          path: research-evidence/teacher/
